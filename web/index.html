<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemma web test</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  button, select, input { font: inherit; margin: 4px 0; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f3f3f3; padding: 8px; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } pre { background: #222; } }
</style>
</head>
<body>
<h1>Gemma web test</h1>
<p id="env"></p>
<label>Robot <select id="robot"><option>bittle</option><option>nybble</option><option>quaddle</option></select></label>
<p>Model: URL <input id="url" type="text"
  value="https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it-web.litertlm"><br>
  or file <input id="file" type="file" accept=".litertlm"></p>
<button id="load">Load model</button>
<button id="eval" disabled>Run eval</button>
<p><button id="connect">Connect robot (Bluetooth)</button> <button id="stop">Stop</button></p>
<p><input id="req" type="text" placeholder="walk forward then sit"> <button id="ask" disabled>Ask</button></p>
<button id="copy">Copy log</button>
<pre id="log"></pre>
<script type="module">
// 0.18.0 = the version Google's hosted chat demo ships. 0.18.1's JS does not match its own WASM
// (Engine.create fails with "getMutableMainExecutorSettings is not a function" on a Pixel 7 Pro, 2026-10-23).
import { Engine, SamplerType } from "https://cdn.jsdelivr.net/npm/@litert-lm/core@0.18.0/+esm";
import { parse } from "./parse.js";
import { connectWebBluetooth, robotFromReply } from "./ble.js";
import { run, STOP, CMD_TIMEOUT_S } from "./runner.js";

const $ = (id) => document.getElementById(id);
const log = (s) => { $("log").textContent += s + "\n"; console.log(s); };
const fetchText = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.text(); };
$("env").textContent = `WebGPU: ${"gpu" in navigator ? "yes" : "NO"} | ${navigator.userAgent}`;

let engine, prompt, pattern, codes, base, prev = null, running = null;

const ROBOTS = ["bittle", "nybble", "quaddle"];  // contract/<robot>.json
let link = null;
// Fetched at page start: requestDevice() needs the user's tap, so connect() must not wait on the network first.
const registryReady = Promise.all(ROBOTS.map(async (r) => {
  const d = JSON.parse(await fetchText(`../contract/${r}.json`));
  return [r, [d.model, d.ble_prefix]];
})).then(Object.fromEntries);

async function connect() {
  const registry = await registryReady;
  const t = performance.now();
  const c = await connectWebBluetooth([...Object.values(registry).map(([, p]) => p), "petoi"], log);
  const robot = robotFromReply(c.reply, registry);
  log(`connected to ${c.name} in ${((performance.now() - t) / 1000).toFixed(1)}s: ${c.reply} -> ${robot ?? "unknown"}`);
  if (!robot) {
    c.link.close();
    throw new Error("not a robot this page knows (no contract model name in the '?' reply)");
  }
  link = c.link;
  link.device.addEventListener("gattserverdisconnected", () => { log("robot disconnected"); link = null; });
  if (robot !== $("robot").value) {
    $("robot").value = robot;
    await loadRobot(robot);
  }
}

// Contract for `robot`; with a loaded model, also a new prefilled conversation (the old base and its last clone
// are left alone: deleting clones out of order broke base.clone() in 0.18.0, and robot switches are rare).
async function loadRobot(robot) {
  prompt = await fetchText(`../contract/${robot}.prompt.txt`);
  pattern = JSON.parse(await fetchText(`../contract/${robot}.schema.json`)).items.pattern;
  codes = JSON.parse(await fetchText(`../contract/${robot}.json`)).codes;
  if (!engine) return;
  const t = performance.now();
  base = await engine.createConversation({
    preface: { messages: [{ role: "system", content: prompt }], extra_context: { enable_thinking: false } },
    sessionConfig: { samplerParams: { type: SamplerType.GREEDY }, maxOutputTokens: 128 },
    prefillPrefaceOnInit: true,
  });
  prev = null;
  log(`system prompt prefilled in ${((performance.now() - t) / 1000).toFixed(1)}s (${robot})`);
}

async function load() {
  const model = $("file").files[0] ?? $("url").value;
  log(`loading ${model.name ?? model} ...`);
  const t = performance.now();
  engine = await Engine.create({ model, mainExecutorSettings: { maxNumTokens: 2048 } });
  log(`model loaded in ${((performance.now() - t) / 1000).toFixed(1)}s`);
  await loadRobot($("robot").value);
  $("eval").disabled = $("ask").disabled = false;
}

const textOf = (m) => typeof m.content === "string" ? m.content
  : (m.content ?? []).filter((p) => p.type === "text").map((p) => p.text).join("");

// Dev hook for web/prefill_experiments.js (run over CDP / chrome://inspect). Getters, so it sees the loaded engine.
window.__test = { get engine() { return engine; }, get prompt() { return prompt; }, get pattern() { return pattern; },
                  get link() { return link; },
                  parse, textOf, SamplerType };

// Each request runs on a clone of the prefilled conversation (~2 s instead of ~9 s re-reading the prompt).
// In 0.18.0, deleting a clone before the next base.clone() breaks it ("Dependency task 1 is invalid"), so the
// previous clone is deleted only after the new one exists. Measured in docs/superpowers/plans/2026-10-23-web-prefill-reuse.md.
async function ask(text) {
  const t = performance.now();
  const conv = await base.clone();
  if (prev) await prev.delete();
  prev = conv;
  const out = textOf(await conv.sendMessage(text)).trim();
  return { out, secs: (performance.now() - t) / 1000, ...parse(pattern, out) };
}

async function runEval() {
  const cases = JSON.parse(await fetchText("../eval/cases.json"));
  let passed = 0; const times = [];
  for (const [text, acceptable] of cases) {
    const r = await ask(text);
    times.push(r.secs);
    const ok = r.error === null && acceptable.some((a) => JSON.stringify(a) === JSON.stringify(r.commands));
    passed += ok;
    log(`${r.secs.toFixed(1)}s | ${ok ? "PASS" : "FAIL"} | ${JSON.stringify(text)} -> ${r.out}` +
        (ok ? "" : `  (${r.error ?? "want " + JSON.stringify(acceptable)})`));
  }
  const avg = times.reduce((a, b) => a + b, 0) / times.length;
  log(`\n${passed}/${cases.length} passed | latency avg ${avg.toFixed(1)}s, max ${Math.max(...times).toFixed(1)}s`);
}

const guard = (fn) => async () => { try { await fn(); } catch (e) { log(`ERROR: ${e?.stack ?? e}`); } };
$("load").onclick = guard(load);
$("connect").onclick = guard(connect);
$("eval").onclick = guard(async () => {  // a second run in parallel doubles every latency
  $("eval").disabled = true;
  try { await runEval(); } finally { $("eval").disabled = false; }
});
$("ask").onclick = guard(async () => {
  const r = await ask($("req").value);
  log(`${r.secs.toFixed(1)}s | ${r.out} -> ${r.error ?? JSON.stringify(r.commands)}`);
  if (!link || r.error || !r.commands.length) return;  // refused or empty: the robot is untouched
  running = new AbortController();
  try {
    await run({ codes, pattern }, r.commands, link, { log, signal: running.signal });
  } finally {
    running = null;
  }
});

// Stop: abort a running plan (run() sends STOP on the way out), else send STOP directly.
function stop(why) {
  if (running) {
    log(`stop: ${why}`);
    running.abort(new Error(why));
  } else if (link) {
    link.send(STOP, CMD_TIMEOUT_S).then((r) => log(`  sent ${STOP} robot: ${r}`), (e) => log(`  STOP FAILED: ${e} - switch the robot off`));
  }
}
$("stop").onclick = () => stop("Stop button");
// A hidden tab may lose the Bluetooth link; a timed turn would then never get its kbalance.
document.addEventListener("visibilitychange", () => { if (document.hidden && running) stop("page hidden"); });
$("robot").onchange = guard(() => loadRobot($("robot").value));
$("copy").onclick = () => navigator.clipboard.writeText($("log").textContent);
</script>
</body>
</html>
